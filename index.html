<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AT&T DVD Bounce</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Black background */
            overflow: hidden; /* Hides scrollbars */
            height: 100vh;
            width: 100vw;
        }

        #bouncing-logo {
            position: absolute; /* Allows us to move it with coordinates */
            width: 200px; /* You can adjust the size of the logo here */
            height: auto;
            will-change: transform; /* Optimizes performance */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <img id="bouncing-logo" src="att.gif" alt="AT&T Logo">

    <script>
        const logo = document.getElementById('bouncing-logo');
        
        // --- Configuration ---
        let x = Math.random() * (window.innerWidth - 200); // Random start X
        let y = Math.random() * (window.innerHeight - 150); // Random start Y
        let speedX = 3; // Horizontal Speed (increase to go faster)
        let speedY = 3; // Vertical Speed
        
        // --- Animation Loop ---
        function update() {
            const logoRect = logo.getBoundingClientRect();
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;

            let hitX = false;
            let hitY = false;

            // Check Horizontal Walls (Left or Right)
            if (x + logoRect.width >= winWidth || x <= 0) {
                speedX = -speedX; // Reverse direction
                hitX = true;
            }

            // Check Vertical Walls (Top or Bottom)
            if (y + logoRect.height >= winHeight || y <= 0) {
                speedY = -speedY; // Reverse direction
                hitY = true;
            }

            // Apply movement
            x += speedX;
            y += speedY;

            // Update CSS to move the element
            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            // --- Corner Detection ---
            // If we hit a horizontal AND vertical wall in the same frame, it's a corner!
            if (hitX && hitY) {
                triggerConfetti();
            }

            // Run this function again on the next frame
            requestAnimationFrame(update);
        }

        // --- Confetti Function ---
        function triggerConfetti() {
            // Basic blue confetti burst
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }, // Approximate center for the burst visual
                colors: ['#00A8E0', '#009FDB', '#FFFFFF'] // AT&T Blue shades and White
            });
        }

        // Start the animation
        update();
        
        // Handle window resizing so the logo doesn't get lost
        window.addEventListener('resize', () => {
            x = Math.min(x, window.innerWidth - 200);
            y = Math.min(y, window.innerHeight - 150);
        });
    </script>
</body>
</html>
