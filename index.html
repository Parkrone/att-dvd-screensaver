<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATT Bouncer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Pitch black for screensaver */
            overflow: hidden; /* Crucial: prevents scrollbars */
            height: 100vh;
            width: 100vw;
            cursor: none; /* Optional: Hides the mouse cursor if visible */
        }

        #bouncing-logo {
            position: absolute;
            width: 200px; /* Adjust logo size here */
            height: auto;
            will-change: transform, left, top;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <img id="bouncing-logo" src="att.gif" alt="AT&T Logo">

    <script>
        const logo = document.getElementById('bouncing-logo');
        
        // --- CONFIGURATION ---
        // Start at a random position
        let x = Math.random() * (window.innerWidth - 200); 
        let y = Math.random() * (window.innerHeight - 150);
        
        // Speed (Try 3, 4, or 5)
        let speedX = 3; 
        let speedY = 3; 
        
        // --- ANIMATION LOOP ---
        function update() {
            const logoRect = logo.getBoundingClientRect();
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;

            let hitX = false;
            let hitY = false;

            // Check Horizontal Walls
            if (x + logoRect.width >= winWidth || x <= 0) {
                speedX = -speedX;
                hitX = true;
            }

            // Check Vertical Walls
            if (y + logoRect.height >= winHeight || y <= 0) {
                speedY = -speedY;
                hitY = true;
            }

            // Move
            x += speedX;
            y += speedY;

            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            // Corner Hit Detection
            if (hitX && hitY) {
                triggerConfetti();
            }

            requestAnimationFrame(update);
        }

        // --- CONFETTI ---
        function triggerConfetti() {
            confetti({
                particleCount: 200, // Big explosion
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#00A8E0', '#009FDB', '#FFFFFF'], // AT&T Blue & White
                disableForReducedMotion: true
            });
        }

        // Start immediately
        update();
        
        // Recalculate bounds if the resolution changes
        window.addEventListener('resize', () => {
            x = Math.min(x, window.innerWidth - 200);
            y = Math.min(y, window.innerHeight - 150);
        });
    </script>
</body>
</html>
