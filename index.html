<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATT Bouncer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none; /* Hides the mouse cursor */
        }
        #bouncing-logo {
            position: absolute;
            width: 200px; 
            height: auto;
            will-change: transform;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <img id="bouncing-logo" src="att.gif" alt="AT&T Logo">

    <script>
        window.onload = function() {
            const logo = document.getElementById('bouncing-logo');
            
            // Start at random position
            let x = Math.random() * (window.innerWidth - 200);
            let y = Math.random() * (window.innerHeight - 150);
            let speedX = 3;
            let speedY = 3;

            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            function update() {
                const logoRect = logo.getBoundingClientRect();
                const winWidth = window.innerWidth;
                const winHeight = window.innerHeight;

                let hitX = false;
                let hitY = false;

                if (x + logoRect.width >= winWidth || x <= 0) {
                    speedX = -speedX;
                    hitX = true;
                }

                if (y + logoRect.height >= winHeight || y <= 0) {
                    speedY = -speedY;
                    hitY = true;
                }

                x += speedX;
                y += speedY;

                logo.style.left = x + 'px';
                logo.style.top = y + 'px';

                if (hitX && hitY) {
                    triggerConfetti();
                }

                requestAnimationFrame(update);
            }

            function triggerConfetti() {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 150,
                        spread: 100,
                        origin: { y: 0.6 },
                        colors: ['#00A8E0', '#009FDB', '#FFFFFF'],
                        disableForReducedMotion: true
                    });
                }
            }

            requestAnimationFrame(update);

            window.addEventListener('resize', () => {
                x = Math.min(x, window.innerWidth - 200);
                y = Math.min(y, window.innerHeight - 150);
            });
        };
    </script>
</body>
</html>
