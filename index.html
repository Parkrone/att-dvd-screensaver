<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATT Bouncer</title>
    <style>
        /* Ensure the entire document is black immediately */
        html, body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            cursor: none; /* Hides the mouse cursor */
        }

        #bouncing-logo {
            position: absolute;
            width: 200px; 
            height: auto;
            will-change: transform, left, top;
            /* Start off-screen to prevent 'pop-in' until JS runs */
            left: -9999px; 
        }
    </style>
    
    <script src="confetti.js"></script>
</head>
<body>

    <img id="bouncing-logo" src="att.gif" alt="AT&T Logo">

    <script>
        window.onload = function() {
            const logo = document.getElementById('bouncing-logo');
            
            // --- CONFIGURATION ---
            let x = Math.random() * (window.innerWidth - 200); 
            let y = Math.random() * (window.innerHeight - 150);
            let speedX = 3; 
            let speedY = 3; 

            // Initial position set
            logo.style.left = x + 'px';
            logo.style.top = y + 'px';
            
            function update() {
                const logoRect = logo.getBoundingClientRect();
                const winWidth = window.innerWidth;
                const winHeight = window.innerHeight;

                let hitX = false;
                let hitY = false;

                // Check Horizontal Walls
                if (x + logoRect.width >= winWidth || x <= 0) {
                    speedX = -speedX;
                    hitX = true;
                }

                // Check Vertical Walls
                if (y + logoRect.height >= winHeight || y <= 0) {
                    speedY = -speedY;
                    hitY = true;
                }

                // Move
                x += speedX;
                y += speedY;

                logo.style.left = x + 'px';
                logo.style.top = y + 'px';

                // Corner Hit Detection
                if (hitX && hitY) {
                    safeTriggerConfetti();
                }

                requestAnimationFrame(update);
            }

            // Wrapper to prevent crashing if confetti.js didn't load
            function safeTriggerConfetti() {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 150, 
                        spread: 100,
                        origin: { y: 0.6 },
                        colors: ['#00A8E0', '#009FDB', '#FFFFFF'],
                        disableForReducedMotion: true
                    });
                } else {
                    console.log("Corner hit! (Confetti library not found)");
                }
            }

            // Start the loop
            requestAnimationFrame(update);
            
            // Handle Resize
            window.addEventListener('resize', () => {
                x = Math.min(x, window.innerWidth - 200);
                y = Math.min(y, window.innerHeight - 150);
            });
        };
    </script>
</body>
</html>
